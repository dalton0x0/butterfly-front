# Configuration de l'analyse SonarQube du frontend.
# Lancement décrit dans le README, section « Analyse statique ».

sonar.projectKey=butterfly-front
sonar.projectName=Butterfly Front

sonar.sourceEncoding=UTF-8

# Code applicatif : tout src sauf les tests, analysés à part avec leurs propres règles.
sonar.sources=src
sonar.exclusions=**/*.test.js

sonar.tests=src
sonar.test.inclusions=**/*.test.js
