# Intégration continue du frontend.
#
# Quatre jobs :
#   1. buildc: analyse ESLint, tests unitaires et construction Vite ;
#   2. security : analyse de sécurité du code (Semgrep) et des dépendances, secrets et
#      Dockerfile (Trivy) ;
#   3. imagec: construction de l'image, scan Trivy, publication dans GHCR. Seulement
#      après une poussée sur main ou un tag de version, et si les deux autres
#      jobs ont réussi : une image publiée est toujours une image testée.
#   4. deploy-staging : après une image publiée depuis main, mise à jour de sa version
#      dans le dépôt butterfly-deploy. Argo CD déploie alors le staging.
#   5. prepare-prod : après une image publiée depuis un tag de version, branche du dépôt
#      butterfly-deploy qui inscrit cette version en production. Fusionner sa
#      pull request déploie la version.
#
# Les actions tierces sont épinglées par SHA de commit, et non par tag : un tag peut être
# déplacé vers un autre code, un SHA non. Le commentaire indique la version
# correspondante, et Dependabot propose les mises à jour.

name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

# Droits minimaux par défaut. Le job qui publie l'image élève les siens.
permissions:
  contents: read

# Une nouvelle poussée sur une pull request annule l'exécution précédente, devenue inutile.
# Sur main et sur les tags, chaque exécution va jusqu'au bout.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Analyse et construction
    runs-on: ubuntu-latest

    # Étapes distinctes et non une seule : quand le job échoue, on sait immédiatement
    # si le problème vient d'une règle ESLint, d'un test ou de la construction Vite.
    steps:
      - name: Récupération des sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installation de Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Même version majeure que l'image de construction du Dockerfile.
          # Les deux doivent rester alignées, sinon le workflow valide un code
          # que l'image ne saurait pas construire.
          node-version: '24'
          cache: npm

      - name: Installation des dépendances
        # npm ci et non npm install : installation reproductible à partir du
        # package-lock.json seul. npm install peut mettre à jour le verrou en
        # silence et livrer des versions différentes de celles testées en local.
        run: npm ci

      - name: Analyse statique
        run: npm run lint

      - name: Tests unitaires
        run: npm test

      - name: Construction
        run: npm run build

  security:
    name: Analyse de sécurité
    runs-on: ubuntu-latest

    steps:
      - name: Récupération des sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Analyse du code (Semgrep)
        # Analyse statique de sécurité : XSS, injection de code, stockage de données
        # sensibles... Seuls les résultats de gravité ERROR font échouer le job. Les
        # avertissements restent visibles dans le journal sans bloquer.
        # Une alerte écartée à raison se marque dans le code par un commentaire
        # « nosemgrep », accompagné de sa justification (exemple : MarkdownContent.vue).
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: |
          python3 -m pip install --quiet semgrep==1.184.0
          semgrep scan --config p/default --error --severity ERROR --metrics off

      - name: Dépendances, secrets et Dockerfile (Trivy)
        # vuln : failles connues des dépendances npm (lues dans package-lock.json) ;
        # secret : clés, mots de passe ou jetons oubliés dans le code ;
        # misconfig : erreurs de configuration du Dockerfile.
        # ignore-unfixed : une faille sans correctif publié ne bloque pas, faute
        # d'action possible. Une exception justifiée se déclare dans .trivyignore.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  image:
    name: Image Docker
    needs: [ build, security ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publication dans GHCR avec le GITHUB_TOKEN du workflow : aucun secret à gérer.
      packages: write

    steps:
      - name: Récupération des sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Préparation de Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Étiquettes de l'image
        # sha-<commit> : identifiant unique de chaque image utilisé pour le déploiement.
        # main : dernière image de la branche principale.
        # 3.4.0 et 3.4 : sur un tag de version v3.4.0.
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Construction de l'image
        # Construite d'abord sans être publiée : le scan doit passer avant la publication.
        # pull : récupère la dernière version des images de base et donc leurs
        # correctifs de sécurité.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          load: true
          tags: ${{ env.IMAGE }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan de l'image (Trivy)
        # Couvre ce que le scan des sources ne voit pas : le système de l'image de base
        # (Alpine, nginx) et les paquets qu'elle contient.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Connexion à GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication de l'image
        # Reconstruction instantanée : toutes les couches viennent du cache de l'étape
        # de construction. L'image publiée est donc celle qui vient d'être scannée.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy-staging:
    name: Déploiement en staging
    needs: [ image ]
    # Sur main seulement : un tag de version publie une image, mais ne la déploie pas.
    # La production se déploie par décision, à la main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Pas de concurrence à gérer entre deux exécutions de ce dépôt : sur main, le groupe
    # concurrency du workflow les fait passer l'une après l'autre, dans l'ordre des
    # poussées. Le staging reçoit donc toujours la dernière image en dernier.
    steps:
      - name: Récupération du dépôt de déploiement
        # Clé de déploiement SSH, avec droit d'écriture sur butterfly-deploy seulement.
        # Le GITHUB_TOKEN de ce workflow ne peut pas écrire dans un autre dépôt.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dalton0x0/butterfly-deploy
          ssh-key: ${{ secrets.DEPLOY_REPO_SSH_KEY }}

      - name: Mise à jour de la version du staging
        # Remplace l'étiquette de l'image dans le kustomization.yaml du staging, puis
        # pousse le changement. Argo CD le détecte et déploie la nouvelle image.
        #
        # sed modifie la seule ligne newTag qui suit le nom de l'image, et laisse le reste
        # du fichier intact. yq, plus naturel pour du YAML, supprime les lignes vides.
        #
        # Le backend et le frontend poussent dans le même dépôt : si l'autre a poussé
        # entre-temps, la poussée est refusée. La modification est alors refaite sur la
        # dernière version du dépôt puis poussée à nouveau. La refaire plutôt que rebaser
        # écarte tout conflit : le job ne s'arrête jamais sur une fusion à résoudre.
        env:
          FILE: k8s/butterfly/staging/kustomization.yaml
        run: |
          # Même format que l'étiquette posée par docker/metadata-action : sha- suivi
          # des 7 premiers caractères du commit.
          TAG="sha-${GITHUB_SHA::7}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main

            # Garde-fou : si le nom de l'image ou la ligne newTag qui le suit venait à
            # changer, le fichier ne serait plus mis à jour, sans aucune erreur visible.
            grep -A1 -x "  - name: $IMAGE" "$FILE" | grep -q '^    newTag: ' \
              || { echo "Image $IMAGE introuvable dans $FILE." >&2; exit 1; }

            sed -i "\\#^  - name: $IMAGE\$#{n;s#^    newTag: .*#    newTag: $TAG#}" "$FILE"
            if git diff --quiet; then
              echo "Le staging utilise déjà $TAG."
              exit 0
            fi

            git commit --quiet -am "chore(staging): deploy ${GITHUB_REPOSITORY#*/} $TAG" \
              -m "Source : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
            if git push --quiet origin HEAD:main; then
              echo "Staging mis à jour : $IMAGE:$TAG"
              exit 0
            fi
            echo "Poussée refusée (tentative $attempt), nouvel essai."
            sleep $((attempt * 5))
          done
          exit 1

  prepare-prod:
    name: Préparation de la mise en production
    needs: [ image ]
    # Sur un tag de version seulement.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    # Prépare la mise en production sans la faire : la nouvelle version est inscrite
    # dans une branche du dépôt butterfly-deploy. Fusionner la pull request de cette
    # branche déploie la version. Le moment du déploiement reste une décision : ordre
    # entre backend et frontend, sauvegarde avant une migration, heure choisie.
    steps:
      - name: Récupération du dépôt de déploiement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dalton0x0/butterfly-deploy
          ssh-key: ${{ secrets.DEPLOY_REPO_SSH_KEY }}

      - name: Branche de mise en production
        env:
          FILE: k8s/butterfly/prod/kustomization.yaml
        run: |
          # Version sans le v du tag : v3.5.0 donne 3.5.0, étiquette publiée par la CI.
          VERSION="${GITHUB_REF_NAME#v}"
          BRANCH="prod/${GITHUB_REPOSITORY#*/}-$VERSION"

          grep -A1 -x "  - name: $IMAGE" "$FILE" | grep -q '^    newTag: ' \
            || { echo "Image $IMAGE introuvable dans $FILE." >&2; exit 1; }

          git checkout -b "$BRANCH"
          sed -i "\\#^  - name: $IMAGE\$#{n;s#^    newTag: .*#    newTag: \"$VERSION\"#}" "$FILE"
          if git diff --quiet; then
            echo "La production utilise déjà $VERSION." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -am "chore(prod): deploy ${GITHUB_REPOSITORY#*/} $VERSION" \
            -m "Source : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          # --force : une relance du workflow sur le même tag remplace la branche.
          git push --quiet --force origin "$BRANCH"

          # Lien affiché dans le résumé de l'exécution, pour ouvrir la pull request.
          {
            echo "### Mise en production de ${GITHUB_REPOSITORY#*/} $VERSION prête"
            echo
            echo "[Ouvrir la pull request]($GITHUB_SERVER_URL/dalton0x0/butterfly-deploy/compare/main...$BRANCH?expand=1)"
            echo
            echo "Fusionner la pull request déploie la version en production."
          } >> "$GITHUB_STEP_SUMMARY"
