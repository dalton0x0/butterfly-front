# Service des fichiers statiques et réacheminement de l'API.

# Résolveur DNS interne de Docker. Sans lui, nginx résout le nom "backend" une seule
# fois au démarrage et garde l'adresse en cache. Après un redémarrage du conteneur
# backend qui change d'adresse, toutes les requêtes partiraient vers une adresse
# morte jusqu'au prochain redémarrage de nginx.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    # Port haut : un processus sans privilège ne peut pas se lier aux ports
    # inférieurs à 1024. La correspondance vers le port 80 de l'hôte est faite
    # par docker compose.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nom du service backend placé dans une variable : c'est ce qui force nginx à
    # interroger le résolveur à chaque requête au lieu de figer l'adresse.
    set $backend_host backend;

    # Compression des réponses textuelles. Les images et polices sont déjà compressées,
    # les inclure consommerait du processeur sans réduire la taille.
    # Attention au type des scripts : depuis nginx 1.21, les fichiers .js sont servis
    # en text/javascript et non plus en application/javascript. Sans cette entrée, le
    # bundle de l'application part sans compression.
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Indique aux caches intermédiaires que la réponse dépend de l'encodage accepté.
    gzip_vary on;

    # Quelques en-têtes de sécurité élémentaires. La politique de sécurité du contenu n'est
    # volontairement pas définie ici : elle demande un travail d'ajustement propre à
    # l'application et une valeur approximative casserait l'interface sans rien protéger.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Les fichiers produits par Vite portent une empreinte dans leur nom : leur contenu ne
    # change jamais pour un nom donné, ils peuvent donc être mis en cache indéfiniment.
    location /assets/ {
        # Un seul Cache-Control posé à la main. La directive expires en poserait un
        # second : le navigateur recevrait deux fois le même en-tête avec des valeurs
        # différentes.
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Règle d'héritage de nginx : un bloc qui déclare son propre add_header perd
        # ceux du niveau supérieur. Les en-têtes de sécurité sont donc répétés ici,
        # sans quoi les scripts et les styles partiraient sans nosniff.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Réacheminement vers le backend. Il couvre aussi les médias servis sous /api/media.
    location /api/ {
        # Avec une variable dans proxy_pass, nginx ne remplace plus le préfixe de la
        # location par le chemin de la directive. On transmet donc $request_uri qui
        # contient l'URI d'origine complète avec sa chaîne de requête.
        proxy_pass http://$backend_host:8080$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # En-tête indispensable à la limitation de débit du backend : sans lui, toutes les
        # requêtes sembleraient provenir de nginx et partageraient un unique quota.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Les envois de vidéos peuvent atteindre 200 Mo côté applicatif : la limite de
        # nginx doit suivre sinon la requête est rejetée avant même d'atteindre le backend.
        client_max_body_size 210m;

        # Délais allongés pour les envois de fichiers volumineux.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Par défaut nginx stocke tout le corps de la requête sur disque avant de le
        # transmettre. Désactivé, l'envoi passe directement vers le backend : pas de
        # fichier temporaire de 200 Mo dans le conteneur, ni de délai doublé.
        proxy_request_buffering off;
    }

    # Documentation de l'API. Le profil docker du backend active Swagger : ces trois
    # chemins le rendent accessible sans ouvrir de port supplémentaire. Avec un profil
    # qui désactive Swagger, ces adresses renverraient simplement la 404 du backend.
    location = /swagger-ui.html {
        proxy_pass http://$backend_host:8080$request_uri;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://$backend_host:8080$request_uri;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://$backend_host:8080$request_uri;
        proxy_set_header Host $host;
    }

    # Application à page unique : toute adresse inconnue renvoie index.html à charge pour
    # le routeur Vue de résoudre la navigation. Sans cette règle, un rechargement sur
    # /profil produirait une erreur 404 de nginx.
    location / {
        try_files $uri $uri/ /index.html;

        # Sans cette directive, le navigateur peut garder un index.html périmé qui
        # référence des assets à empreinte disparus après un redéploiement, d'où une
        # page blanche. La directive expires n'écrase pas les add_header hérités.
        expires -1;
    }
}
